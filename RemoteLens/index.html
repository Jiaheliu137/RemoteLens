<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RemoteLens</title>
    <script>
    // Set the theme before the first paint so the window never flashes the wrong colours.
    (function () {
        var root = document.documentElement;
        var names = { LIGHT: 'light', LIGHTGRAY: 'lightgray', GRAY: 'gray', DARK: 'dark', BLUE: 'blue', PURPLE: 'purple' };
        var theme = 'light';
        var platform = 'win32';
        if (typeof eagle !== 'undefined' && eagle.app) {
            theme = names[eagle.app.theme] || (eagle.app.isDarkColors() ? 'gray' : 'light');
            platform = eagle.app.platform || platform;
        }
        root.setAttribute('theme', theme);
        root.setAttribute('platform', platform);
    })();
    </script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <header class="header">
            <div class="drag">
                <img class="logo" src="logo.png" alt="">
                <span class="title">RemoteLens</span>
            </div>
            <div class="action">
                <button class="icon-button" id="titlebar-help">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="7.25" stroke="currentColor" stroke-width="1.5"/><path d="M9.9 10.1a2.2 2.2 0 1 1 3.2 2c-.75.4-1.1.85-1.1 1.6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="12" cy="16.1" r=".95" fill="currentColor"/></svg>
                </button>
                <button class="icon-button" id="titlebar-pin">
                    <svg class="pin-icon-normal" width="24" height="24" viewBox="0 0 24 24" fill="none">
                        <path d="M14.012 5.78978C13.822 5.59992 13.572 5.5 13.302 5.5C13.242 5.5 13.172 5.5 13.112 5.51998C12.782 5.57994 12.512 5.79977 12.382 6.10953L10.992 9.33705C10.862 9.63682 10.592 9.85665 10.272 9.92659L8.30195 10.3163C7.94195 10.3862 7.65195 10.656 7.54195 11.0058C7.43195 11.3555 7.53195 11.7452 7.79195 12.005L9.54195 13.7537L5.65195 17.6407C5.45195 17.8405 5.45195 18.1503 5.65195 18.3501C5.75195 18.45 5.88195 18.5 6.00195 18.5C6.12195 18.5 6.26195 18.45 6.35195 18.3501L10.242 14.4631L11.992 16.2118C12.182 16.4016 12.442 16.5015 12.702 16.5015C12.802 16.5015 12.892 16.4915 12.992 16.4616C13.342 16.3517 13.612 16.0619 13.682 15.7022L14.072 13.7337C14.132 13.4139 14.352 13.1441 14.662 13.0142L17.892 11.6253C18.192 11.4954 18.422 11.2256 18.482 10.8958C18.542 10.5661 18.442 10.2364 18.212 9.99654L14.012 5.78978ZM14.272 12.0749C13.662 12.3347 13.232 12.8743 13.102 13.5238L12.712 15.4923L8.50195 11.2955L10.472 10.9058C11.122 10.7759 11.662 10.3363 11.922 9.73674L13.312 6.50922L17.512 10.706L14.272 12.0749Z" fill="currentColor"/>
                    </svg>
                    <svg class="pin-icon-pinned" width="24" height="24" viewBox="0 0 24 24" fill="none" style="display:none;">
                        <path d="M18.2036 9.98655L14.0057 5.78978C13.8158 5.59992 13.5659 5.5 13.2961 5.5C13.2361 5.5 13.1661 5.5 13.1062 5.51998C12.7763 5.57994 12.5065 5.79977 12.3765 6.10953L11.1272 9.01729L11.8868 9.77671C11.8868 9.77671 11.9068 9.75673 11.9068 9.73674L13.2961 6.50922L17.494 10.706L14.2656 12.0949C14.2656 12.0949 14.2456 12.1149 14.2256 12.1149L14.9852 12.8743L17.8938 11.6253C18.1936 11.4954 18.4235 11.2256 18.4835 10.8958C18.543 10.5684 18.4398 10.2226 18.2036 9.98655ZM6.84882 6.14873C6.64892 5.94889 6.33908 5.94889 6.13918 6.14873C6.03923 6.24865 5.98925 6.37855 5.98925 6.49846C5.98925 6.61837 6.03923 6.75826 6.13918 6.84819L9.38805 10.0965L8.29859 10.3163C7.93878 10.3862 7.64892 10.656 7.53898 11.0058C7.42903 11.3555 7.52898 11.7452 7.78885 12.005L9.53797 13.7537L5.64992 17.6407C5.45003 17.8405 5.45003 18.1503 5.64992 18.3501C5.74987 18.45 5.87981 18.5 5.99975 18.5C6.11969 18.5 6.25962 18.45 6.34957 18.3501L10.2376 14.4631L11.9867 16.2118C12.1766 16.4016 12.4365 16.5015 12.6964 16.5015C12.7963 16.5015 12.8863 16.4915 12.9862 16.4616C13.3361 16.3517 13.6059 16.0619 13.6759 15.7022L13.8958 14.613L17.1447 17.8613C17.3446 18.0611 17.6544 18.0611 17.8543 17.8613C17.9542 17.7613 18.0042 17.6314 18.0042 17.5115C18.0042 17.3916 17.9542 17.2517 17.8543 17.1618L6.84882 6.14873ZM12.6964 15.4923L8.49849 11.2955L10.2376 10.9458L13.0362 13.7437L12.6864 15.4823L12.6964 15.4923Z" fill="currentColor"/>
                    </svg>
                </button>
                <div class="titlebar-wnd-btn" id="titlebar-minimize">
                    <svg width="12" height="12" viewBox="0 0 12 12"><rect x="1" y="5.5" width="10" height="1" fill="currentColor"/></svg>
                </div>
                <div class="titlebar-wnd-btn" id="titlebar-maximize">
                    <svg class="maximize-icon" width="12" height="12" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="1" stroke="currentColor" stroke-width="1" fill="none"/></svg>
                    <svg class="restore-icon" width="12" height="12" viewBox="0 0 12 12" style="display:none;">
                        <rect x="3" y="1" width="7.5" height="7.5" rx="1" stroke="currentColor" stroke-width="1" fill="none"/>
                        <rect x="1.5" y="3.5" width="7.5" height="7.5" rx="1" stroke="currentColor" stroke-width="1" fill="var(--color-theme)"/>
                    </svg>
                </div>
                <div class="titlebar-wnd-btn titlebar-wnd-close" id="titlebar-close">
                    <svg width="12" height="12" viewBox="0 0 12 12"><path d="M2 2l8 8M10 2L2 10" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
                </div>
            </div>
        </header>

        <main class="body">
            <div class="column column-qr">
                <section class="card card-qr">
                    <div class="qr-box qr-empty" id="qr"></div>
                    <div class="qr-hint" id="qrHint"></div>
                    <div class="url-list" id="urls"></div>
                </section>
            </div>

            <div class="column column-main">
                <section class="card">
                    <div class="row">
                        <span class="row-label" data-i18n="ui.access"></span>
                        <div class="row-controls">
                            <span class="status-text" id="status"></span>
                            <span class="divider-vertical"></span>
                            <label class="switch">
                                <input type="checkbox" id="enabled">
                                <span class="switch-track"><span class="switch-knob"></span></span>
                            </label>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <div class="row">
                        <span class="row-label" data-i18n="ui.library"></span>
                        <span class="row-value" id="library"></span>
                    </div>
                </section>

                <div class="notice" id="notice" hidden></div>

                <section class="card">
                    <div class="row">
                        <span class="row-label" data-i18n="ui.token"></span>
                        <div class="row-controls">
                            <code class="mono" id="token"></code>
                            <button class="button-small" id="tokenToggle"></button>
                            <button class="button-small" id="tokenCopy" data-i18n="ui.copy"></button>
                            <button class="button-small" id="tokenReset" data-i18n="ui.reset"></button>
                        </div>
                    </div>
                    <div class="row">
                        <span class="row-label" data-i18n="ui.port"></span>
                        <div class="row-controls">
                            <span class="caption" id="connections"></span>
                            <input class="input" id="port" type="number" min="1024" max="65534" step="1">
                            <button class="button-small" id="portApply" data-i18n="ui.apply"></button>
                        </div>
                    </div>
                    <div class="row">
                        <span class="row-label" data-i18n="ui.cache"></span>
                        <div class="row-controls">
                            <span class="caption" id="cacheSize"></span>
                            <button class="button-small" id="cacheClear" data-i18n="ui.clear"></button>
                        </div>
                    </div>
                    <div class="divider"></div>
                    <label class="option">
                        <span class="option-text">
                            <span class="option-title" data-i18n="ui.allowSwitch"></span>
                            <span class="option-hint" data-i18n="ui.allowSwitchHint"></span>
                        </span>
                        <span class="switch">
                            <input type="checkbox" id="allowSwitch">
                            <span class="switch-track"><span class="switch-knob"></span></span>
                        </span>
                    </label>
                    <label class="option">
                        <span class="option-text">
                            <span class="option-title" data-i18n="ui.allowLan"></span>
                            <span class="option-hint" data-i18n="ui.allowLanHint"></span>
                        </span>
                        <span class="switch">
                            <input type="checkbox" id="allowLan">
                            <span class="switch-track"><span class="switch-knob"></span></span>
                        </span>
                    </label>
                </section>

                <div class="footer" data-i18n="ui.footer"></div>
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none">
        <div class="modal-box">
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-actions">
                <button class="button" id="modalCancel" data-i18n="ui.cancel"></button>
                <button class="button button-primary" id="modalConfirm" data-i18n="ui.ok"></button>
            </div>
        </div>
    </div>

    <script src="js/vendor/qrcode.js"></script>
    <script src="js/preview.js"></script>
    <script src="js/plugin.js"></script>
</body>
</html>

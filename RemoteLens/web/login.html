<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>RemoteLens</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/app.css">
</head>
<body class="login-page">
    <form id="loginForm" class="login-card" autocomplete="off">
        <img src="/icon.svg" alt="" class="login-logo" width="56" height="56">
        <h1 data-t="title">RemoteLens</h1>
        <p class="login-hint" data-t="hint"></p>
        <input id="loginToken" class="login-input" type="password" inputmode="text" autocapitalize="off"
               autocorrect="off" spellcheck="false" required>
        <button class="btn-primary login-btn" type="submit" data-t="submit"></button>
        <p id="loginError" class="login-error" role="alert"></p>
    </form>
    <script src="/login.js"></script>
</body>
</html>
